services:
  product-db:
    image: postgres:16-alpine
    container_name: pickandorder-product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
      POSTGRES_DB: pickandorder_products
    ports:
      - "5433:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d pickandorder_products"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  product_postgres_data:
